// This file contains the RPC service definition for multipooler.

syntax = "proto3";

package multipoolerservice;

import "clustermetadata.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";
import "mtrpc.proto";
import "query.proto";

option go_package = "github.com/multigres/multigres/go/pb/multipoolerservice";

// MultipoolerService provides connection pooling and query execution
service MultipoolerService {
  // ExecuteQuery executes a SQL query and returns the result
  // This should be used sparingly only when we know the result set is small,
  // otherwise StreamExecute should be used.
  rpc ExecuteQuery(ExecuteQueryRequest) returns (ExecuteQueryResponse);

  // StreamExecute executes a SQL query and streams the results back
  rpc StreamExecute(StreamExecuteRequest) returns (stream StreamExecuteResponse);

  // ExecuteStream amortizes RPC setup over sequential query-service operations.
  // The server sends ready before accepting SQL. Each operation ends in exactly
  // one completion frame, including on SQL error. Transport loss is NOT safe to
  // retry after sending SQL. Reservations remain explicit and independent of
  // this transport; clients must still release them on disconnect.
  rpc ExecuteStream(stream ExecuteStreamRequest) returns (stream ExecuteStreamResponse);

  // PortalStreamExecute executes a portal (bound prepared statement) and streams results
  // Returns reserved connection information for session affinity
  rpc PortalStreamExecute(PortalStreamExecuteRequest) returns (stream PortalStreamExecuteResponse);

  // Describe returns metadata about a prepared statement or portal
  rpc Describe(DescribeRequest) returns (DescribeResponse);

  // GetAuthCredentials retrieves authentication credentials for a user.
  // Used by multigateway to get SCRAM password hashes for client authentication.
  //
  // NOTE: This API may change. Currently fetches credentials one user at a time.
  // Future iterations could switch to a streaming model where multigateway maintains
  // an up-to-date cache of all password hashes and by real-time updates from multipooler
  // when any credentials change.
  rpc GetAuthCredentials(GetAuthCredentialsRequest) returns (GetAuthCredentialsResponse);

  // CopyBidiExecute handles bidirectional streaming operations (e.g., COPY commands).
  // The gateway sends the initial command and then streams data/messages.
  // The pooler responds with protocol-specific messages and final result.
  rpc CopyBidiExecute(stream CopyBidiExecuteRequest) returns (stream CopyBidiExecuteResponse);

  // StreamReplication tunnels the raw PostgreSQL replication wire protocol as
  // opaque bytes between the gateway and a pinned replication=database backend.
  // The pooler does not interpret the replication sub-protocol; bytes flow
  // verbatim in both directions. Used for logical replication (Realtime).
  rpc StreamReplication(stream StreamReplicationRequest) returns (stream StreamReplicationResponse);

  // ConcludeTransaction concludes a transaction on a reserved connection with COMMIT or ROLLBACK.
  // The connection may remain reserved if there are other reasons to keep it (e.g., temp tables).
  // Returns the reserved state - if non-empty, the connection is still reserved.
  rpc ConcludeTransaction(ConcludeTransactionRequest) returns (ConcludeTransactionResponse);

  // DiscardTempTables sends DISCARD TEMP on a reserved connection and removes the temp table reason.
  // The connection may remain reserved if there are other reasons to keep it (e.g., active transaction).
  // Returns the reserved state - if non-empty, the connection is still reserved.
  rpc DiscardTempTables(DiscardTempTablesRequest) returns (DiscardTempTablesResponse);

  // ReleaseReservedConnection forcefully releases a reserved connection regardless of reason.
  // Used during client disconnect to clean up all reserved connections on the multipooler.
  // If the connection has a transaction, ROLLBACK is executed.
  // If the connection has an active COPY, CopyFail is sent.
  // If the connection has portals, they are released.
  // If any cleanup step fails, the connection is tainted and closed.
  rpc ReleaseReservedConnection(ReleaseReservedConnectionRequest) returns (ReleaseReservedConnectionResponse);

  // StreamPoolerHealth streams health updates from the multipooler.
  //
  // The server sends an initial health response immediately upon connection,
  // then pushes updates whenever the health state changes. If no state change
  // occurs within the heartbeat interval, the server sends a heartbeat to
  // confirm the stream is alive.
  //
  // Clients MUST implement a staleness timeout. The recommended timeout is provided
  // in recommended_staleness_timeout in each response. If no message is
  // received within this timeout, the pooler should be marked unhealthy.
  //
  // Each response contains the full health state (not incremental updates).
  rpc StreamPoolerHealth(StreamPoolerHealthRequest) returns (stream StreamPoolerHealthResponse);

  // NotificationStream opens a bidirectional stream for one gateway client
  // session. Subscription updates and notification delivery share one stream so
  // notifications across channels preserve PostgreSQL delivery order.
  rpc NotificationStream(stream NotificationStreamRequest) returns (stream NotificationStreamResponse);

  // GetBackingConnection returns the named backing connection. It is served only
  // by the default primary pooler, which owns the connection metadata; unmanaged
  // poolers call it at bootstrap to learn the external endpoint they front. The
  // reply carries the credential, so the call should travel over TLS; it is
  // protected only by the transport's authentication, and there is no
  // per-call authorization.
  rpc GetBackingConnection(GetBackingConnectionRequest) returns (GetBackingConnectionResponse);

  // GetTablegroupBinding returns the name of the connection a tablegroup is bound to, or
  // an empty name when the tablegroup is served by its managed cohort. It is served only
  // by the default primary pooler. A pooler compares it with the connection it fronts
  // before it admits application work, so a pooler that fronts one connection never
  // serves a tablegroup that is bound to another. It carries no credential: the connection
  // itself is read with GetBackingConnection. A tablegroup that does not exist is
  // NOT_FOUND.
  rpc GetTablegroupBinding(GetTablegroupBindingRequest) returns (GetTablegroupBindingResponse);

  // ---- Admission fences and routing rules (migration cutover) ----------------
  //
  // The RPCs below are the control-plane interface used by a migration controller
  // to move application traffic between tablegroups. Each is served only by the
  // leader of the control home (the default tablegroup), which owns the routing
  // and admission metadata; every other pooler answers UNAVAILABLE and the caller
  // must rediscover it from topology.
  //
  // The RPCs are primitives that are safe by construction and report facts; the
  // migration controller owns policy: how long to wait, whether to retry or give
  // up, when to reopen, what to catch the destination up to, which preflight checks
  // to run. Anything whose misuse could cost correctness stays here.
  //
  // Control and metadata RPCs are never fenced: an admission fence refuses
  // application queries only.
  //
  // An OPERATION is one migration, named by an operation_id (a UUID the controller
  // chooses) that it passes to every call. Two things are persisted on the default
  // primary, each changed only by a compare-and-set on what the caller read:
  //
  //   * An admission fence guards a scope (today, a tablegroup; shard and table scopes
  //     are reserved and answer UNIMPLEMENTED). It is a state, UNFENCED, FENCING or
  //     FENCED, and a version. A scope serves application work only while it is UNFENCED
  //     or has no fence at all. FENCING means a fence was decided and its members are
  //     not all confirmed clean; FENCED means every member answered clean. A scope has at
  //     most one fence, held by one operation. Another operation may take the scope over
  //     only when the holder's fence is UNFENCED (the takeover is a write of FENCING at the
  //     next version), and a fence that is FENCING or FENCED for another operation
  //     answers FAILED_PRECONDITION. An unfence does not delete the fence: it writes
  //     UNFENCED at the next version. An operation's fences are deleted by
  //     CleanupOperation.
  //
  //   * A routing rule says that the traffic of one tablegroup goes to another (and to a
  //     shard of it). The effective tablegroup of the database is its home tablegroup, or,
  //     when a rule applies to the home, the rule's destination: at most one rule, applied
  //     once. A rule exists only between SwitchRouting and FoldRouting or RevertRouting.
  //     routing_version goes up by one every time a rule is switched, reverted or
  //     folded.
  //
  // Admission and routing are separate. The only rule that links them is that
  // SwitchRouting and RevertRouting require both tablegroups of the rule to be FENCED
  // for the operation, checked in the transaction that writes the routing, so a
  // controller that mistakes an incomplete fence for a complete one cannot move the
  // traffic. FoldRouting needs no fence: it changes the catalog, not where the
  // traffic goes.
  //
  // A cutover is: start and commit the fences of the source and the destination, read the
  // source's WAL position (pg_current_wal_insert_lsn() on the source, once it is fenced) and
  // catch the destination up to it, SwitchRouting, unfence the destination. Then, when the
  // migration is complete, FoldRouting, and, once the source's poolers are decommissioned,
  // CleanupOperation. A rollback, before the fold, is: fence both again, RevertRouting,
  // unfence the source.
  //
  // StartFence, CommitFence, UnfenceScope, SwitchRouting, RevertRouting, FoldRouting and
  // CleanupOperation are safe to repeat: each recognizes the exact state its own success, or
  // a retry of it, leaves, and rejects every other. Every response returns the row it wrote,
  // so the caller passes back what it got and never computes the next version.
  //
  // Nothing here undoes a fence by itself: a fence that cannot complete stays FENCING, and the
  // controller decides whether to commit it again, to start it again, or to unfence. A
  // controller whose call has an unknown outcome (a timeout, a lost connection) repeats it
  // until it answers definitively, then reads GetRoutingState and decides, relative to the
  // move in progress. A side that was fenced before, by an earlier cutover or by someone
  // else, is not this move's to reopen. A controller that is lost, with the coordinator,
  // leaves the scope FENCING or FENCED for a person to unfence.
  //
  // Error contract shared by the RPCs:
  //   INVALID_ARGUMENT     malformed request, including an operation_id that is not a UUID.
  //   NOT_FOUND            the tablegroup of a scope or a rule is not in the catalog.
  //   UNIMPLEMENTED        a scope below the tablegroup (a shard or a table).
  //   FAILED_PRECONDITION  the persisted state is not the one the call expects. A
  //                        definitive answer: read GetRoutingState and decide; do not retry
  //                        blindly.
  //   ABORTED              the call could not complete: for a fence, some member did not
  //                        close, or is not clean (see StartFence and CommitFence), and the
  //                        row is as the call left it; for a routing change, the state
  //                        changed between its check and its write (it did not commit:
  //                        definitive).
  //   UNAVAILABLE          transient. This includes "this pooler is not the default
  //                        primary": rediscover it from topology and retry. It is not a
  //                        definitive answer, since a call that may have committed through
  //                        a pooler that has just lost its place must not look definitive.
  //   UNKNOWN, INTERNAL,   the outcome of a call that writes is uncertain: it may or may not
  //   DEADLINE_EXCEEDED    have committed. Every call is safe to repeat.
  //
  // The calls below are authenticated by the gRPC transport only. Where the state is persisted
  // is the default primary's business and not part of this contract.

  // GetRoutingState returns the authoritative routing and admission metadata, read in one
  // snapshot: the home tablegroup, the routing rules, the admission fences, and the
  // routing_version they are at. Use it to decide which versions to pass, and to reconcile
  // an interrupted operation, including after the migration controller itself changes
  // leader. A scope with no fence is unfenced. When since_version is the current
  // routing_version the response has not_modified set and omits the home and the rules;
  // the fences are always returned, because they change without a change of the
  // routing_version.
  rpc GetRoutingState(GetRoutingStateRequest) returns (GetRoutingStateResponse);

  // StartFence begins a fence of one scope for an operation: it writes FENCING and tells
  // every member, in every cell, to close its gate, and returns at once. It waits for
  // nothing. Each member closes, and answers in the same call what it holds (see FenceBusy):
  // clean, busy (with what holds it) or unreachable (with the error). Whether anything is
  // held, and what to do about it, is the controller's; CommitFence is the call that
  // completes the fence.
  //
  // The version names a fence attempt. expected_version is the version the caller read (the
  // one GetRoutingState or an earlier response returned, which the caller passes back as it
  // got it; zero for a scope with no fence). If the scope is unfenced at that version (no
  // fence, or UNFENCED) this begins a new attempt: the coordinator writes FENCING at the next
  // version, taking the scope over if another operation left it UNFENCED, and asks the
  // members. If it is FENCING for this operation at the version, or at the version after, this
  // is a repeat of the attempt, whose reply may have been lost: nothing is written and the
  // members are asked again, which closes any that missed it. If it is FENCED for this
  // operation at the version, or the one after, the attempt is complete and the call succeeds
  // without asking anyone. Any other state is rejected with FAILED_PRECONDITION, including a
  // scope that is FENCING or FENCED for another operation. The response returns the fence,
  // FENCING (or FENCED) and its version, which is what the controller passes to CommitFence
  // and to unfence. If every member answered the call succeeds, whatever each holds; if one
  // did not answer it fails with ABORTED, the fence stays FENCING, the per-member results are
  // the StartFenceResponse in the error's details, and the controller calls it again.
  //
  // A tablegroup whose durability policy, or the control home's, needs fewer than two nodes
  // is refused with FAILED_PRECONDITION before anything is written, and so is one with more
  // than one unmanaged pooler. A pooler that is not the default primary answers UNAVAILABLE.
  rpc StartFence(StartFenceRequest) returns (StartFenceResponse);

  // CommitFence completes the current fence attempt of a scope, when nothing is left. It
  // asks every member of the tablegroup, from a fresh listing of its poolers, to apply the
  // fence and say what it holds, which closes a member that is not closed yet and waits for
  // nothing. If every member says it holds nothing (its gate is closed, no application
  // request is running and no application reservation is held), it writes FENCED at the same
  // version, the version does not change, and returns the fence. A fenced scope is one in
  // which nothing is running and, the gates being closed, nothing can start.
  //
  // Otherwise it writes nothing and fails with ABORTED, the fence staying FENCING, and the
  // per-member results are the CommitFenceResponse in the error's details: a member is busy
  // (a request is running or an application reservation is held, with what holds it: see
  // FenceBusy) or unreachable (with the error). Every member is asked even when one fails.
  // There is no way to skip or exclude a member: a pooler is left out only by being gone from
  // topology, and one that does not answer fails the call, as does one that joined, which is
  // asked like the rest. A commit that runs while another commit of the same fence completes
  // it may answer ABORTED; asked again it succeeds, since the fence is FENCED at the version.
  // CommitFence is idempotent: if the fence is FENCED for the operation at the version the
  // call succeeds, asking nobody, and any other state or version is rejected with
  // FAILED_PRECONDITION. The version is the one the fence had when the attempt began, as the
  // start returned it, and the commit does not change it.
  //
  // Waiting is the controller's. It calls CommitFence again, as often and for as long as its
  // policy says, and decides what to do about what it finds. Busy reports facts. Ordinary
  // work finishes by itself: requests on an existing reservation still pass a closed gate, so
  // a transaction can commit, and an idle reservation is reaped by the reserved pool's
  // inactivity timeout. A controller that does not want to wait may end a session on the
  // source (see HeldReservation); Multigres itself never ends a client's state. Control
  // traffic, the LISTEN connection and logical replication streams are not application work:
  // moving the consumers of a replication stream is the migration's job, and the pooler ends
  // the streams it has at shutdown. Assumption: replication connections through the pooler
  // are used only for replication. SQL sent over a replication connection is not covered by
  // fencing, and callers must not use replication connections for writes.
  //
  // The fence covers what goes through the pooler and nothing else. That every application
  // writer goes through it, and that the writers that cannot (scheduled jobs, background
  // workers on the source) have been stopped, is a precondition of a cutover that the
  // migration workflow meets: direct connections to the database are neither fenced nor looked
  // for.
  //
  // The fence returns no WAL position. After it succeeds nothing more is written through the
  // fenced poolers, and the controller reads the position it needs from the source itself.
  rpc CommitFence(CommitFenceRequest) returns (CommitFenceResponse);

  // UnfenceScope writes UNFENCED, at the next version, over the fence of a scope and asks the
  // members to reopen on a best-effort basis, reporting the ones it could not reach: there is
  // no acknowledgement barrier, since a pooler opens once it reads UNFENCED. The fence stays,
  // UNFENCED, until CleanupOperation deletes it. The controller repeats the call with the same
  // version until none is unreached; that is safe, because a repeat is a success that writes
  // nothing.
  //
  // expected_version is the version v of the fence being undone. If the fence is FENCING or
  // FENCED for the operation at v the coordinator writes UNFENCED at v+1. If it is already
  // UNFENCED for the operation at v+1 the unfence was done: the call succeeds, writes nothing,
  // and asks the members again. Any other state is rejected.
  rpc UnfenceScope(UnfenceScopeRequest) returns (UnfenceScopeResponse);

  // SwitchRouting adds the routing rule of an operation, so that the traffic of the rule's
  // from_tablegroup goes to its to_tablegroup, in one transaction that also checks the
  // preconditions: the routing is at expected_routing_version; from_tablegroup is the home
  // tablegroup and is not the default tablegroup; no other rule exists; and the fences of
  // from_tablegroup and to_tablegroup are both FENCED for this operation (a completed fence:
  // FENCING is refused with FAILED_PRECONDITION), read with a row lock so that neither can
  // change under the write. It bumps routing_version. Success means the routing metadata
  // committed; it does not unfence anything. A retry after the switch, which finds the
  // operation SWITCHED at the version after expected_routing_version, with the rule it asked
  // for, succeeds and writes nothing. An operation that was cleaned up, or folded, is refused. That the operation exists as a whole, and that the rules cover the keyspace
  // exactly, are not checked yet.
  rpc SwitchRouting(SwitchRoutingRequest) returns (SwitchRoutingResponse);

  // RevertRouting deletes the routing rule of an operation, so that the traffic goes back to
  // the home tablegroup, under the same preconditions as SwitchRouting: the routing is at
  // expected_routing_version, and the fences of the rule's two tablegroups are FENCED for this
  // operation. It bumps routing_version. A retry after the revert, which finds the
  // operation REVERTED at the version after expected_routing_version, succeeds and writes
  // nothing; an operation in any other state, whatever the version, is refused.
  rpc RevertRouting(RevertRoutingRequest) returns (RevertRoutingResponse);

  // FoldRouting completes a switched operation: in one transaction it makes the rule's
  // to_tablegroup the home tablegroup, deletes the rule and bumps routing_version, so that the
  // routing is empty again. It needs no fence, because the effective tablegroup is the same
  // before and after, and it refuses to run if it would not be: the call resolves the traffic
  // before and after and fails with FAILED_PRECONDITION if they differ. A retry after the
  // fold, which finds the operation FOLDED at the version after expected_routing_version,
  // succeeds and writes nothing; an operation in any other state, whatever the version, is
  // refused.
  //
  // PROTOTYPE STUB: this moves a home pointer. The routing-rule implementation that replaces
  // it moves the catalog membership of the tablegroup instead.
  rpc FoldRouting(FoldRoutingRequest) returns (FoldRoutingResponse);

  // CleanupOperation deletes the fences of an operation and ends the operation for good: a later
  // call that names it, a StartFence replayed after the cleanup for one, is refused with
  // FAILED_PRECONDITION. It is refused with FAILED_PRECONDITION while the operation has a
  // routing rule, or has a fence that is FENCING, and it is ABORTED, deleting nothing, if a
  // routing change committed since the state was read. A fence that is FENCED is deleted too, but
  // deleting a fence tells no pooler anything: a pooler that decided to refuse application work
  // keeps that decision until it restarts or its role changes, and nothing refreshes it. So
  // cleaning up UNFENCED fences changes nothing for serving, and cleaning up a FENCED one requires
  // that the poolers of its scope are gone: the controller keeps the source fenced after the fold
  // until its unmanaged poolers are decommissioned, and cleans up after. Cleaning up an operation
  // that has nothing left succeeds.
  rpc CleanupOperation(CleanupOperationRequest) returns (CleanupOperationResponse);

  // RefreshAdmission is called by the coordinator on each member of a tablegroup, for a
  // start and for a commit alike. The pooler re-reads its tablegroup's fence from the control
  // home, applies it (closes its gate, or opens it) and reports what it holds, without
  // waiting for anything. Migration controllers do not call this.
  rpc RefreshAdmission(RefreshAdmissionRequest) returns (RefreshAdmissionResponse);
}

// ExecuteQueryRequest represents a request to execute a SQL query
message ExecuteQueryRequest {
  string query = 1;

  // target specifies the routing destination (tablegroup, shard, pooler type)
  query.Target target = 2;

  uint64 max_rows = 3;

  // caller_id identifies the caller. This is the effective caller ID,
  // set by the application to further identify the caller.
  mtrpc.CallerID caller_id = 4;

  // options contains execution options including session state needed for query execution.
  query.ExecuteOptions options = 5;
}

// ExecuteQueryResponse represents the response from executing a SQL query
message ExecuteQueryResponse {
  query.QueryResult result = 1;

  // reserved_state contains the authoritative reservation state from multipooler.
  query.ReservedState reserved_state = 5;
}

// StreamExecuteRequest represents a request to execute a SQL query with streaming results
message StreamExecuteRequest {
  // query is the SQL query to execute
  string query = 1;

  // target specifies the routing destination (tablegroup, shard, pooler type)
  query.Target target = 2;

  // caller_id identifies the caller. This is the effective caller ID,
  // set by the application to further identify the caller.
  mtrpc.CallerID caller_id = 3;

  // options contains execution options including session state needed for query execution.
  query.ExecuteOptions options = 4;

  // reservation_options controls connection reservation behavior.
  // When set with non-zero reasons, StreamExecute creates a new reserved connection
  // (or extends the reasons on an existing one if options.reserved_connection_id is set).
  query.ReservationOptions reservation_options = 5;
}

// StreamExecuteResponse represents a single response in the stream of query results
message StreamExecuteResponse {
  // result contains the query result data (rows, fields, etc.) or diagnostics (notices)
  query.QueryResultPayload result = 1;

  // reserved_state contains the authoritative reservation state from multipooler.
  // Sent in a final message after query execution completes.
  query.ReservedState reserved_state = 5;
}

// Operation capabilities advertised by ExecuteStream's initial ready frame.
// A peer with no capability list supports only STREAM_EXECUTE (the original protocol).
enum ExecuteStreamOperation {
  EXECUTE_STREAM_OPERATION_UNSPECIFIED = 0;
  STREAM_EXECUTE = 1;
  PORTAL_STREAM_EXECUTE = 2;
  EXECUTE_QUERY = 3;
  DESCRIBE = 4;
  CONCLUDE_TRANSACTION = 5;
  DISCARD_TEMP_TABLES = 6;
  RELEASE_RESERVED_CONNECTION = 7;
  COPY_BIDI_EXECUTE = 8;
}

message ExecuteStreamRequest {
  // One typed request starts each operation; field 1 retains wire compatibility.
  // COPY continues with copy_input frames until end=true.
  oneof operation {
    StreamExecuteRequest request = 1;
    PortalStreamExecuteRequest portal_stream_execute = 4;
    ExecuteQueryRequest execute_query = 5;
    DescribeRequest describe = 6;
    ConcludeTransactionRequest conclude_transaction = 7;
    DiscardTempTablesRequest discard_temp_tables = 8;
    ReleaseReservedConnectionRequest release_reserved_connection = 9;
    CopyBidiExecuteRequest copy_bidi_execute = 10;
    CopyStreamInput copy_input = 11;
  }
  // Only telemetry propagation fields, never authentication metadata.
  map<string, string> propagation = 2;
  // Remaining operation timeout; zero means no deadline. Cancellation also
  // cancels the leased transport, never a subsequently reused operation.
  int64 timeout_nanos = 3;
}

message ExecuteStreamResponse {
  bool ready = 1;
  // Streamed operations may send many results; unary operations send exactly
  // one on success. Every operation ends with a separate completion frame.
  oneof result {
    StreamExecuteResponse response = 2;
    PortalStreamExecuteResponse portal_stream_execute = 5;
    ExecuteQueryResponse execute_query = 6;
    DescribeResponse describe = 7;
    ConcludeTransactionResponse conclude_transaction = 8;
    DiscardTempTablesResponse discard_temp_tables = 9;
    ReleaseReservedConnectionResponse release_reserved_connection = 10;
    CopyBidiExecuteResponse copy_bidi_execute = 11;
  }
  // Original gRPC status and details. Transport EOF is never completion.
  google.rpc.Status completion = 3;
  // Only present in the initial ready frame; negotiate before submitting work.
  repeated ExecuteStreamOperation supported_operations = 4;
  // Only valid with completion. The operation finished, but the transport must
  // be discarded (e.g. to interrupt an upload after an early COPY FROM error).
  bool retire = 12;
}

// PortalStreamExecuteRequest represents a request to execute a portal with streaming results
message PortalStreamExecuteRequest {
  // target specifies the routing destination (tablegroup, shard, pooler type)
  query.Target target = 1;

  // prepared_statement contains the prepared statement to execute
  query.PreparedStatement prepared_statement = 2;

  // portal contains the portal with bound parameters
  query.Portal portal = 3;

  // caller_id identifies the caller
  mtrpc.CallerID caller_id = 4;

  // options contains execution options including max rows and reserved connection ID
  query.ExecuteOptions options = 5;

  // portal_options contains portal-specific knobs that don't apply to plain
  // StreamExecute. Kept on PortalStreamExecuteRequest (rather than
  // ExecuteOptions) so the portal-only fields don't leak into every other
  // request type that carries ExecuteOptions.
  PortalExecuteOptions portal_options = 6;

  // reservation_options controls connection reservation behavior, mirroring
  // StreamExecuteRequest.reservation_options. When set with non-zero reasons
  // and no options.reserved_connection_id, the multipooler reserves a new
  // backend with these reasons (running BeginQuery first if ReasonTransaction
  // is set) and runs the portal on it atomically. When the connection is
  // already reserved, the reasons are OR'd onto it before the portal runs.
  query.ReservationOptions reservation_options = 7;
}

// PortalExecuteOptions carries knobs that only make sense on the portal
// (extended-protocol) execution path.
message PortalExecuteOptions {
  // include_describe asks the multipooler to fuse a portal Describe('P')
  // into the same backend round trip as Execute, so the gateway can resolve
  // libpq-style Bind+Describe(P)+Execute+Sync batches without two RPCs.
  // The portal RowDescription rides back on the streaming response Fields
  // of the first chunk; for DML (NoData) the Fields stay nil.
  bool include_describe = 1;
}

// PortalStreamExecuteResponse represents a response in the portal execution stream
message PortalStreamExecuteResponse {
  // result contains the query result data (rows, fields, etc.) or diagnostics
  query.QueryResultPayload result = 1;

  // reserved_state contains the authoritative reservation state from multipooler.
  // This is returned in the first response and should be used for subsequent queries.
  query.ReservedState reserved_state = 5;
}

// DescribeRequest represents a request to describe a prepared statement or portal
message DescribeRequest {
  // target specifies the routing destination (tablegroup, shard, pooler type)
  query.Target target = 1;

  // prepared_statement is the prepared statement to describe (nil if describing a portal)
  query.PreparedStatement prepared_statement = 2;

  // portal is the portal to describe (nil if describing a prepared statement)
  query.Portal portal = 3;

  // caller_id identifies the caller
  mtrpc.CallerID caller_id = 4;

  // options contains execution options including reserved connection ID
  query.ExecuteOptions options = 5;
}

// DescribeResponse represents the response from describing a statement or portal
message DescribeResponse {
  // description contains the statement metadata (fields, parameter types, etc.)
  query.StatementDescription description = 1;
}

// GetAuthCredentialsRequest represents a request to get authentication credentials for a user.
message GetAuthCredentialsRequest {
  // database is the database the user is connecting to.
  string database = 1;

  // username is the PostgreSQL username to authenticate.
  string username = 2;
}

// GetAuthCredentialsResponse represents the response containing authentication credentials.
// Returns codes.NotFound if the user does not exist.
message GetAuthCredentialsResponse {
  // scram_hash is the stored SCRAM-SHA-256 password hash from pg_authid.
  // Format: SCRAM-SHA-256$<iterations>:<salt>$<stored_key>:<server_key>
  // Empty if user exists but has no password set.
  string scram_hash = 1;

  // is_replication_role mirrors pg_authid.rolreplication. PostgreSQL requires
  // this attribute (or rolsuper) for any connection started with the
  // replication=true / replication=database startup parameter. The gateway
  // enforces it after SCRAM completes and rejects with SQLSTATE 42501 if false.
  bool is_replication_role = 2;
}

// CopyBidiExecuteRequest represents a message in the bidirectional execute stream from gateway to pooler.
// Used for commands that require bidirectional streaming (e.g., COPY FROM STDIN, COPY TO STDOUT).
message CopyBidiExecuteRequest {
  // Phase indicates which phase of the operation this message represents
  enum Phase {
    INITIATE = 0;  // Initial command
    DATA = 1;      // Data chunk (for COPY FROM STDIN)
    DONE = 2;      // Finalize operation (all data sent for COPY FROM, or ready to receive for COPY TO)
    FAIL = 3;      // Abort operation
  }

  // Direction indicates whether the COPY operation streams data into the
  // server (FROM STDIN) or out from the server (TO STDOUT). Set on INITIATE.
  enum Direction {
    FROM_STDIN = 0; // Default for back-compat: clients without this field set get FROM STDIN.
    TO_STDOUT = 1;
  }

  // phase indicates the current phase
  Phase phase = 1;

  // direction indicates COPY ... FROM STDIN vs COPY ... TO STDOUT (INITIATE only).
  Direction direction = 9;

  // query is the SQL command to execute (only for INITIATE phase)
  string query = 2;

  // target specifies the routing destination (only for INITIATE phase)
  query.Target target = 3;

  // caller_id identifies the caller (only for INITIATE phase)
  mtrpc.CallerID caller_id = 4;

  // options contains execution options (only for INITIATE phase)
  query.ExecuteOptions options = 5;

  // data contains the data chunk (for DATA and DONE phases in COPY FROM STDIN)
  bytes data = 6;

  // error_message contains the error message (for FAIL phase)
  string error_message = 7;

  // reservation_options controls connection reservation behavior (only for INITIATE phase).
  // When set with a transaction reason and begin_query, the executor will start a
  // transaction on the new connection before initiating COPY.
  query.ReservationOptions reservation_options = 8;
}

// CopyBidiExecuteResponse represents a message in the bidirectional execute stream from pooler to gateway.
// Used for responses to commands that require bidirectional streaming.
message CopyBidiExecuteResponse {
  // Phase indicates which phase of the response this represents
  enum Phase {
    READY = 0;    // Command initiated successfully, ready for data streaming
    // For COPY FROM STDIN: PostgreSQL sent CopyInResponse
    // For COPY TO STDOUT: PostgreSQL sent CopyOutResponse
    DATA = 1;     // Data chunk (for COPY TO STDOUT)
    RESULT = 2;   // Final result (CommandComplete)
    ERROR = 3;    // Error occurred
  }

  // phase indicates the current phase
  Phase phase = 1;

  // reserved_state contains the authoritative reservation state from multipooler.
  // Used in READY phase (connection info) and RESULT/ERROR phases (remaining reasons).
  query.ReservedState reserved_state = 10;

  // format indicates the COPY format (for READY phase with COPY commands)
  // 0 = text, 1 = binary
  int32 format = 4;

  // column_formats contains the format code for each column (for READY phase with COPY commands)
  // Each value is 0 (text) or 1 (binary)
  repeated int32 column_formats = 8;

  // data contains the data chunk (for DATA phase in COPY TO STDOUT)
  bytes data = 5;

  // result contains the final query result (for RESULT phase)
  query.QueryResult result = 6;

  // error contains the error message (for ERROR phase)
  string error = 7;

  // notices carries PostgreSQL NoticeResponse/InfoResponse diagnostics
  // collected during this phase. Trigger RAISE NOTICE output, INFO progress
  // messages, and other backend notices appear here so the gateway can
  // forward them to the client as NoticeResponse frames between CopyData and
  // CommandComplete. Populated on READY (notices seen before CopyInResponse /
  // CopyOutResponse), DATA (notices interleaved with CopyData on COPY TO
  // STDOUT), and RESULT (notices read between CopyDone and CommandComplete).
  repeated query.PgDiagnostic notices = 11;

  // error_diagnostic carries the structured PostgreSQL ErrorResponse for
  // ERROR phase responses. When the error originates from PG (e.g.
  // constraint violation, "column does not exist"), this preserves SQLSTATE,
  // severity, DETAIL, HINT, position, etc., so the gateway can re-emit a
  // verbatim ErrorResponse instead of a wrapped Go-formatted string.
  // The `error` field above remains populated as a fallback for callers /
  // log paths that only need the message text.
  query.PgDiagnostic error_diagnostic = 12;
}

// ReplicationMode selects which startup parameter the pooler uses when opening
// the backend replication connection.
enum ReplicationMode {
  REPLICATION_MODE_UNSPECIFIED = 0;
  REPLICATION_MODE_DATABASE = 1;  // replication=database (logical)
}

message StreamReplicationInit {
  query.Target target = 1;        // routing destination (PRIMARY)
  mtrpc.CallerID caller_id = 2;
  ReplicationMode mode = 3;

  // user and user_auth are the minimum needed to open the dedicated
  // replication=database backend as the requesting role. user_auth carries the
  // SCRAM passthrough keys (ClientKey/ServerKey) captured at the gateway during
  // client auth — the same credentials the query path forwards in
  // ExecuteOptions.user_auth. The rest of ExecuteOptions (session settings,
  // MaxRows, reservation) is meaningless to a protocol-blind replication tunnel
  // and is intentionally omitted.
  string user = 4;
  query.UserAuth user_auth = 5;
}

message StreamReplicationRequest {
  oneof msg {
    StreamReplicationInit init = 1;  // MUST be the first message
    bytes data = 2;                  // opaque client->server bytes
  }
}

message StreamReplicationReady {
  // Reserved for future fields (e.g. backend identity). Empty in v1.
}

message StreamReplicationError {
  query.PgDiagnostic diagnostic = 1;  // structured infrastructure error
}

message StreamReplicationResponse {
  oneof msg {
    StreamReplicationReady ready = 1;  // backend opened, tunnel live
    bytes data = 2;                    // opaque server->client bytes
    StreamReplicationError error = 3;  // infrastructure error (NOT a PG ErrorResponse)
  }
}

// ReservationReason indicates why a connection needs to be reserved.
// Values are powers of 2 to allow combining multiple reasons via bitwise OR.
// A connection can be reserved for multiple reasons simultaneously (e.g., transaction + temp table).
// The connection is only released when all reasons are cleared.
enum ReservationReason {
  RESERVATION_REASON_UNSPECIFIED = 0;
  // Connection is reserved for a transaction - execute BEGIN before the query
  RESERVATION_REASON_TRANSACTION = 1;  // 0b001
  // Connection is reserved due to temporary tables - no BEGIN needed
  RESERVATION_REASON_TEMP_TABLE = 2;   // 0b010
  // Connection is reserved for portal/cursor operations
  RESERVATION_REASON_PORTAL = 4;       // 0b0100
  // Connection is reserved for an active COPY operation
  RESERVATION_REASON_COPY = 8;         // 0b1000
  // Connection is reserved for LISTEN/NOTIFY (dedicated PubSubListener connection)
  RESERVATION_REASON_LISTEN = 16;      // 0b10000
  // Connection is reserved for a logical-replication session (CREATE_REPLICATION_SLOT,
  // START_REPLICATION, etc.). Pinned to a single backend for the session's lifetime.
  RESERVATION_REASON_LOGICAL_REPLICATION = 32;  // 0b100000
  // Connection is reserved because the session holds one or more session-level
  // advisory locks (pg_advisory_lock / pg_advisory_lock_shared). These locks
  // live on a specific backend and survive transaction boundaries, so the
  // backend must stay pinned until every such lock is released. Transaction-level
  // advisory locks (pg_advisory_xact_lock) do NOT set this reason.
  RESERVATION_REASON_SESSION_ADVISORY_LOCK = 64;  // 0b1000000
  // Connection is reserved because the session called setseed(...). The seed
  // affects only this backend's PRNG state and has no reset command, not even
  // DISCARD ALL, so this reservation is sticky: unlike every other reason, it
  // survives DISCARD ALL and is released only at the connection's real
  // teardown (client disconnect). That release does not clear the seed
  // itself either, so a later, unrelated session can inherit it; that
  // residual-state gap is accepted since it only affects the statistical
  // freshness of an unrelated session's random() sequence.
  RESERVATION_REASON_SET_SEED = 128;  // 0b10000000
  // Connection is an unsafe connection (the per-connection mode that gives the
  // client its own dedicated backend and suppresses the unsafe-statement
  // rejections). Such a connection may run statements that change untracked
  // backend session state, so its backend must never be returned to the shared
  // pool where the change would leak to another client. Pinned to a single
  // backend for the session's lifetime and, like SET_SEED, sticky: it survives
  // DISCARD ALL and is released only at the connection's real teardown, when the
  // tainted backend is discarded.
  RESERVATION_REASON_UNSAFE_CONNECTION = 256;  // 0b100000000
}

// TransactionConclusion specifies how to conclude a transaction.
enum TransactionConclusion {
  TRANSACTION_CONCLUSION_UNSPECIFIED = 0;
  // Execute COMMIT to commit the transaction
  TRANSACTION_CONCLUSION_COMMIT = 1;
  // Execute ROLLBACK to rollback the transaction
  TRANSACTION_CONCLUSION_ROLLBACK = 2;
}

// ConcludeTransactionRequest represents a request to conclude a transaction on a reserved connection.
// The connection may or may not be released back to the pool depending on whether there are
// other reasons to keep it reserved (e.g., temporary tables).
message ConcludeTransactionRequest {
  // target specifies the routing destination (tablegroup, shard, pooler type)
  query.Target target = 1;

  // caller_id identifies the caller
  mtrpc.CallerID caller_id = 2;

  // options must include reserved_connection_id to identify the connection
  query.ExecuteOptions options = 3;

  // conclusion specifies whether to COMMIT or ROLLBACK the transaction
  TransactionConclusion conclusion = 4;

  // release_portal_names lists `DECLARE … WITH HOLD` cursor names that
  // PostgreSQL would close as part of this ROLLBACK — typically the
  // cursors declared inside the explicit transaction block. Used so the
  // multipooler unpins exactly those portals (matching PG's behavior)
  // instead of dropping every pin via ReleaseAllPortals.
  //
  // Honored only when conclusion == ROLLBACK and release_all_portals is
  // false. Ignored on COMMIT (PG keeps every WITH HOLD cursor across
  // COMMIT, so no pin should be released).
  repeated string release_portal_names = 5;

  // release_all_portals, when true on a ROLLBACK conclusion, asks the
  // multipooler to drop every portal pin on the reserved connection
  // (`ReleaseAllPortals` semantics). When false, only the names listed
  // in release_portal_names are released. Default true preserves the
  // historical behavior so old gateway clients that do not yet compute
  // the per-txn diff keep working.
  bool release_all_portals = 6;

  // chain executes COMMIT AND CHAIN or ROLLBACK AND CHAIN instead of the plain
  // transaction-ending command. The reserved backend remains pinned for the
  // next transaction so transaction characteristics are inherited exactly.
  bool chain = 7;

  // rollback_session_settings is the session-settings map that is true when
  // this transaction ends in a rollback: the multigateway's pre-BEGIN
  // snapshot. options.session_settings carries the in-transaction map (true
  // on COMMIT success); PostgreSQL can conclude a COMMIT request as a
  // rollback (COMMIT on a failed transaction, or a COMMIT that itself fails
  // on e.g. a deferred constraint), and in those outcomes the released
  // backend must be labelled with this map, never the in-transaction one.
  // REQUIRED on every conclude (on the plain-ROLLBACK path the gateway has
  // already reverted, so it sends its current map here). A message (not a
  // bare map) so present-but-empty is distinguishable from absent; the
  // multipooler treats absence on a rollback outcome as an invariant
  // violation and closes the backend instead of stamping any label.
  SessionSettingsSnapshot rollback_session_settings = 8;
}

// SessionSettingsSnapshot wraps a session-settings map so message presence
// distinguishes "no snapshot provided" from "snapshot with zero settings".
message SessionSettingsSnapshot {
  map<string, string> vars = 1;
}

// ConcludeTransactionResponse represents the response from concluding a transaction.
message ConcludeTransactionResponse {
  // result contains the result of the COMMIT or ROLLBACK command
  query.QueryResult result = 1;

  // reserved_state contains the authoritative reservation state from multipooler.
  // If reserved_connection_id is zero, the connection was released and ScatterConn should clear its state.
  query.ReservedState reserved_state = 5;
}

// DiscardTempTablesRequest represents a request to discard temp tables on a reserved connection.
// The connection may or may not be released back to the pool depending on whether there are
// other reasons to keep it reserved (e.g., active transaction).
message DiscardTempTablesRequest {
  // target specifies the routing destination (tablegroup, shard, pooler type)
  query.Target target = 1;

  // caller_id identifies the caller
  mtrpc.CallerID caller_id = 2;

  // options must include reserved_connection_id to identify the connection
  query.ExecuteOptions options = 3;
}

// DiscardTempTablesResponse represents the response from discarding temp tables.
message DiscardTempTablesResponse {
  // result contains the result of the DISCARD TEMP command
  query.QueryResult result = 1;

  // reserved_state contains the authoritative reservation state from multipooler.
  // If reserved_connection_id is zero, the connection was released and ScatterConn should clear its state.
  query.ReservedState reserved_state = 5;
}

// ReleaseReservedConnectionRequest requests forceful release of a reserved connection.
// The multipooler will handle all cleanup internally (rollback, COPY abort, portal release).
// If any cleanup step fails, the connection is tainted and closed so the pool creates a fresh one.
message ReleaseReservedConnectionRequest {
  // target specifies the routing destination (tablegroup, shard, pooler type)
  query.Target target = 1;

  // caller_id identifies the caller
  mtrpc.CallerID caller_id = 2;

  // options must include reserved_connection_id to identify the connection
  query.ExecuteOptions options = 3;

  // keep_sticky_reservations, when true, leaves the connection reserved
  // instead of returning it to the pool if a sticky reservation reason
  // remains after the usual cleanup (rollback, COPY abort, temp table
  // discard, advisory unlock). A sticky reason has no PostgreSQL command
  // that undoes it (RESERVATION_REASON_SET_SEED or
  // RESERVATION_REASON_UNSAFE_CONNECTION), so it can only be cleared by the
  // connection's real teardown. Real client-disconnect
  // cleanup always leaves this false, so a sticky reason never blocks a
  // connection's actual teardown.
  bool keep_sticky_reservations = 4;
}

// ReleaseReservedConnectionResponse is the response from releasing a reserved connection.
message ReleaseReservedConnectionResponse {
  // reserved_state is set only when keep_sticky_reservations left the
  // connection reserved rather than releasing it; the gateway should keep
  // tracking this reservation instead of clearing its local shard state.
  query.ReservedState reserved_state = 1;
}

// StreamPoolerHealthRequest initiates a health stream from the multipooler.
// Currently empty; future versions may add fields for client-requested intervals.
message StreamPoolerHealthRequest {
}

// StreamPoolerHealthResponse contains the current health state of the multipooler.
// Sent immediately on connection, on state changes, and periodically as heartbeats.
message StreamPoolerHealthResponse {
  // pooler_id identifies this multipooler instance.
  clustermetadata.ID pooler_id = 2;

  // serving_status is the current serving state of the pooler.
  clustermetadata.PoolerServingStatus serving_status = 3;

  // routing_state is this pooler's self-reported routing/HA role plus the rule
  // that qualifies it. It is always populated: role == PRIMARY means this pooler
  // is the writable leader (the signal clients gate write traffic on, replacing
  // the former separate leader_observation + writable fields), role == REPLICA
  // means it is not. Clients route writes to the PRIMARY and buffer when there
  // is none. This is a routing/writability signal, not a consensus signal.
  clustermetadata.RoutingState routing_state = 4;

  // recommended_staleness_timeout is the duration clients should use
  // to detect a stale/dead health stream. If no message is received within
  // this duration, clients should mark the pooler as unhealthy.
  google.protobuf.Duration recommended_staleness_timeout = 5;

  // replication_lag_ns is the current replication lag in nanoseconds,
  // measured via heartbeat timestamps. Zero on a leader or when unknown.
  int64 replication_lag_ns = 6;

  // backend_ready is true while an unmanaged pooler's external backend is
  // reachable, writable, and matches the identity of its backing connection.
  // It is false while unverified, on an identity mismatch, and on any managed
  // pooler (whose readiness is reported through serving_status and
  // routing_state).
  bool backend_ready = 7;

  // admission_closed is true while the pooler's application gate is closed: it is
  // serving and healthy but refuses application queries, whatever the reason (a
  // fence, or the admission state not read yet after a start, a role change or a
  // reconnect). Gateways exclude such a pooler from selection and buffer until one
  // admits again.
  bool admission_closed = 8;
}

// BackingConnection is the configuration of an external PostgreSQL. It names one
// server: the pooler's admin and application connections must reach the same one.
message BackingConnection {
  // name identifies the connection within a database.
  string name = 1;

  // host is the hostname or IP address of the server. A host list is refused.
  string host = 2;

  // port is the TCP port of the server.
  int32 port = 3;

  // database is the database the pooler connects to.
  string database = 4;

  // user is the role the pooler connects as.
  string user = 5;

  // password is the credential of user. It is never logged.
  string password = 6;

  // ssl_mode, ssl_root_cert and ssl_negotiation are the TLS settings of the
  // connection; empty keeps the pooler's configured default.
  string ssl_mode = 7;
  string ssl_root_cert = 8;
  string ssl_negotiation = 9;

  // expected_system_identifier is the pg_control_system() system identifier the
  // endpoint must report. An endpoint that reports another identifier is not
  // the intended source.
  string expected_system_identifier = 10;
}

// GetBackingConnectionRequest asks the default primary for a named connection.
message GetBackingConnectionRequest {
  // database is the database the connection belongs to.
  string database = 1;

  // connection_name is the name of the requested connection.
  string connection_name = 2;
}

// GetBackingConnectionResponse carries the requested connection.
message GetBackingConnectionResponse {
  BackingConnection connection = 1;
}

// GetTablegroupBindingRequest asks which connection a tablegroup is bound to.
message GetTablegroupBindingRequest {
  // database is the database the tablegroup belongs to.
  string database = 1;

  // tablegroup is the name of the tablegroup.
  string tablegroup = 2;
}

// GetTablegroupBindingResponse names the connection a tablegroup is bound to.
message GetTablegroupBindingResponse {
  // backing_connection names the connection that backs the tablegroup, as
  // GetBackingConnection knows it. Empty when the tablegroup is served by its managed
  // cohort.
  string backing_connection = 1;
}

// NotificationStreamRequest updates the subscribed channels for one gateway
// client session.
message NotificationStreamRequest {
  // target identifies the shard to listen on.
  query.Target target = 1;

  // subscribe_channels are channels to add to this session's subscription set.
  repeated string subscribe_channels = 2;

  // unsubscribe_channels are channels to remove from this session's subscription set.
  repeated string unsubscribe_channels = 3;

  // unsubscribe_all removes every channel from this session's subscription set.
  bool unsubscribe_all = 4;
}

// NotificationStreamResponse is either a subscription-update acknowledgement or
// a PostgreSQL notification. A response with ready=true acknowledges that the
// preceding subscription update is active on PostgreSQL.
message NotificationStreamResponse {
  query.PgNotification notification = 1;
  bool ready = 2;
}

// Operation-local equivalent of half-closing a dedicated COPY RPC. Even if
// COPY fails early, clients send end before returning the lease; servers discard
// remaining input through end before reading the next operation. Completion
// acknowledges handler return and may precede end to avoid a duplex deadlock.
message CopyStreamInput {
  oneof input {
    CopyBidiExecuteRequest request = 1;
    bool end = 2;
  }
}

// AdmissionScope is what an admission fence guards. Today only a whole tablegroup is a scope:
// a shard or a table must be empty, and a request that names one is UNIMPLEMENTED.
message AdmissionScope {
  // tablegroup is the name of the tablegroup.
  string tablegroup = 1;

  // shard is reserved for a shard scope. It must be empty.
  string shard = 2;

  // table is reserved for a table scope. It must be empty.
  string table = 3;
}

// AdmissionFence is the admission fence of one scope: the state a scope's poolers enforce.
// A scope with no fence is unfenced at version zero.
message AdmissionFence {
  // operation_id is the operation that holds the scope.
  string operation_id = 1;

  // scope is what the fence guards.
  AdmissionScope scope = 2;

  // state is the scope's admission state. The scope serves application work only while it is
  // UNFENCED; FENCING and FENCED both refuse it, and only FENCED says that every member was
  // confirmed clean.
  AdmissionState state = 3;

  // version goes up by one every time the scope is fenced or unfenced; it does not change when
  // a fence completes. Fence and unfence name the version they expect.
  int64 version = 4;

  // updated_at is when the fence last changed.
  google.protobuf.Timestamp updated_at = 5;
}

// RoutingRule says that the traffic of from_tablegroup goes to to_tablegroup. Today a rule
// covers a whole tablegroup: it has no key range.
message RoutingRule {
  // from_tablegroup is the tablegroup whose traffic moves. It must be the home tablegroup.
  string from_tablegroup = 1;

  // to_tablegroup is where the traffic goes.
  string to_tablegroup = 2;

  // to_shard is the name of the shard of to_tablegroup that receives it, as the catalog names
  // it, for example "0-inf".
  string to_shard = 3;
}

// RoutingRuleState is a routing rule as it is persisted.
message RoutingRuleState {
  // operation_id is the operation that switched the rule.
  string operation_id = 1;

  RoutingRule rule = 2;

  // created_version is the routing_version the rule was switched at.
  int64 created_version = 3;
}

// AdmissionState is the admission state of a scope.
enum AdmissionState {
  ADMISSION_STATE_UNSPECIFIED = 0;
  // UNFENCED: the scope serves application work. A scope with no fence is UNFENCED at version
  // zero.
  ADMISSION_STATE_UNFENCED = 1;
  // FENCING: a fence was decided and its members are not all confirmed clean: it is in
  // progress, it failed, or its coordinator was lost. Every member that was asked refuses
  // application work; none is known to hold none. SwitchRouting refuses it.
  ADMISSION_STATE_FENCING = 2;
  // FENCED: every member answered clean. Only this state is a completed fence, and
  // SwitchRouting requires it on both tablegroups.
  ADMISSION_STATE_FENCED = 3;
}

// GetRoutingStateRequest selects what to read.
message GetRoutingStateRequest {
  // database is the database to read.
  string database = 1;

  // since_version is the routing_version the caller already holds; zero reads everything.
  int64 since_version = 2;
}

// GetRoutingStateResponse is a read from the control home's leader, taken in one snapshot.
message GetRoutingStateResponse {
  // routing_version increases every time a rule is switched, reverted or folded. Pollers use it
  // to detect a change cheaply, and a routing change names the version it expects.
  int64 routing_version = 1;

  // not_modified is set when since_version is the current routing_version: home_tablegroup and
  // rules are then omitted.
  bool not_modified = 2;

  // home_tablegroup is the tablegroup that receives the database's application traffic when no
  // rule applies to it. Empty when the database has no catalog state yet.
  string home_tablegroup = 3;

  // rules are the routing rules. At most one.
  repeated RoutingRuleState rules = 4;

  // fences are the admission fences, of every operation. A scope that is not listed is
  // unfenced.
  repeated AdmissionFence fences = 5;
}

// MemberFenceResult is one member's answer to StartFence or CommitFence.
message MemberFenceResult {
  // pooler_id identifies the member.
  clustermetadata.ID pooler_id = 1;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    // CLEAN: the member's gate is closed and it runs no application request and holds no
    // application reservation.
    STATUS_CLEAN = 1;
    // BUSY: the member's gate is closed, and busy says what it still holds.
    STATUS_BUSY = 2;
    // UNREACHABLE: the member did not answer, or failed for another reason; detail is the
    // error.
    STATUS_UNREACHABLE = 3;
  }
  Status status = 2;

  // detail says why a member is not clean.
  string detail = 3;

  // busy says what holds a BUSY member. It is set only when the member reported it.
  FenceBusy busy = 4;
}

// FenceBusy is what a member with a closed gate found still running or held when it
// was asked. It reports facts, with nothing the client sent: no query text, no
// parameters, no credentials. The controller decides what to do with it.
message FenceBusy {
  // requests_in_flight is how many application requests were still running. The gate
  // closed when the fence began, so they all predate the fence: their count is
  // reported without ages.
  int32 requests_in_flight = 1;

  // reservations_held is how many application reservations were held, in total.
  int32 reservations_held = 2;

  // reservations describes the held reservations, the longest held first, at most 20
  // of them.
  repeated HeldReservation reservations = 3;

  // reservations_truncated is how many held reservations are not listed.
  int32 reservations_truncated = 4;
}

// HeldReservation describes one reserved connection that keeps a fence busy.
message HeldReservation {
  // reasons names why the connection is reserved, with the pooler's own labels for
  // the reservation reasons: transaction, temp_table, portal, copy,
  // session_advisory_lock, set_seed, unsafe_connection.
  repeated string reasons = 1;

  // held_for is how long the connection has been reserved.
  google.protobuf.Duration held_for = 2;

  // idle_for is how long ago the last request on the connection ended. It is zero
  // while in_use is true: a request that is running has been running since before
  // it, however long, and the connection is not idle.
  google.protobuf.Duration idle_for = 3;

  // user is the role the connection serves.
  string user = 4;

  // backend_pid is the process id of the PostgreSQL backend.
  int32 backend_pid = 5;

  // reserved_connection_id identifies the reservation within the pooler.
  int64 reserved_connection_id = 6;

  // client_connection_id is the gateway's identifier of the client session, when the
  // pooler was given one (it is zero otherwise).
  int64 client_connection_id = 7;

  // in_use is whether a request that names this reservation is running on the pooler
  // now. A reservation that a request is creating is not yet in use; a controller
  // that acts on idle_for should also check the backend itself.
  bool in_use = 8;

  // client_port is the local TCP port of the pooler's connection to the backend. It is the
  // client_port that PostgreSQL shows for that backend in pg_stat_activity, so with
  // backend_pid it names the connection exactly: a process id that was reused by another
  // backend does not have this port. It needs no clock and no privilege to read. It equals the
  // server's client_port only on a direct TCP connection: a NAT or a proxy between the pooler
  // and PostgreSQL changes the port the server sees, and the statement below then matches
  // nothing and ends nothing, which fails safe. It is zero when the connection is not TCP (the
  // server shows -1 for a Unix socket), and a controller must then not end the session this way.
  //
  // A controller that decides to end a session does it on the source, in two steps on its own
  // connection: it reads state and state_change of the row of pg_stat_activity with that pid and
  // client_port and goes on only if the backend is idle (state 'idle' or 'idle in transaction')
  // for as long as it wants, then ends it with one statement that names what it read, so a
  // session that resumed in between is not ended, for instance
  //   SELECT pg_terminate_backend(pid) FROM pg_stat_activity
  //   WHERE pid = $1 AND client_port = $2 AND state_change = $3
  // The pooler's in_use and idle_for do not cover a reservation that a request is creating,
  // which is why the controller reads the state itself. Multigres never ends a session.
  int32 client_port = 9;
}

// StartFenceRequest asks to begin a fence of one scope.
message StartFenceRequest {
  // database is the database the scope belongs to.
  string database = 1;

  // operation_id is the operation the fence belongs to, a UUID the controller chooses.
  string operation_id = 2;

  // scope is what to fence.
  AdmissionScope scope = 3;

  // expected_version is the version the caller read, as it got it (see StartFence): unfenced
  // at it begins a new attempt, FENCING at it or the version after is a repeat, FENCED at it or
  // the version after is done.
  int64 expected_version = 4;
}

// StartFenceResponse is returned when every member answered; when one did not, the same
// message is the details of the ABORTED error.
message StartFenceResponse {
  // fence is the persisted fence after the call: FENCING at the version of the attempt (FENCED
  // if the fence was already complete). The caller passes that version to CommitFence and to
  // unfence, as it got it.
  AdmissionFence fence = 1;

  // members has one result for every member of the tablegroup that was asked: CLEAN, BUSY (with
  // what holds it) or UNREACHABLE. It is empty when the fence was already FENCED.
  repeated MemberFenceResult members = 2;
}

// CommitFenceRequest asks to complete the current fence attempt of one scope.
message CommitFenceRequest {
  // database is the database the scope belongs to.
  string database = 1;

  // operation_id is the operation the fence belongs to.
  string operation_id = 2;

  // scope is what is being fenced.
  AdmissionScope scope = 3;

  // version is the version of the attempt, the one StartFence returned in fence. The call needs
  // the scope to be FENCING at it, or FENCED at it, which is success.
  int64 version = 4;
}

// CommitFenceResponse is returned when the scope is FENCED; when it cannot be, the same message
// is the details of the ABORTED error.
message CommitFenceResponse {
  // fence is the persisted fence after the call: FENCED at the version of the attempt (FENCING in
  // the error's details).
  AdmissionFence fence = 1;

  // members has one result for every member of the tablegroup: CLEAN, BUSY (with what holds it)
  // or UNREACHABLE. It is empty when the fence was already FENCED.
  repeated MemberFenceResult members = 2;
}

// UnfenceScopeRequest asks to unfence one scope.
message UnfenceScopeRequest {
  // database is the database the scope belongs to.
  string database = 1;

  // operation_id is the operation the fence belongs to.
  string operation_id = 2;

  // scope is what to unfence.
  AdmissionScope scope = 3;

  // expected_version is the version of the fence being undone. A delayed unfence of an old
  // fence can never open a newer one; repeating the same unfence is a success (see
  // UnfenceScope).
  int64 expected_version = 4;
}

// UnfenceScopeResponse is returned once the fence is UNFENCED.
message UnfenceScopeResponse {
  // fence is the persisted fence after the call.
  AdmissionFence fence = 1;

  // unreached lists the members that could not be asked to reopen. A member that was not asked
  // reads its fence again only when it restarts or its role changes, so the controller repeats
  // the unfence until none is unreached.
  repeated clustermetadata.ID unreached = 2;
}

// SwitchRoutingRequest asks to move application traffic.
message SwitchRoutingRequest {
  // database is the database whose routing changes.
  string database = 1;

  // operation_id is the operation the rule belongs to.
  string operation_id = 2;

  // rule is the rule to add.
  RoutingRule rule = 3;

  // expected_routing_version is the routing_version the caller read.
  int64 expected_routing_version = 4;
}

// SwitchRoutingResponse reports the committed routing.
message SwitchRoutingResponse {
  // routing_version is the version after the change.
  int64 routing_version = 1;

  // effective_tablegroup is the tablegroup that now receives application traffic.
  string effective_tablegroup = 2;
}

// RevertRoutingRequest asks to put the traffic back on the home tablegroup.
message RevertRoutingRequest {
  // database is the database whose routing changes.
  string database = 1;

  // operation_id is the operation whose rule is deleted.
  string operation_id = 2;

  // expected_routing_version is the routing_version the caller read.
  int64 expected_routing_version = 3;
}

// RevertRoutingResponse reports the committed routing.
message RevertRoutingResponse {
  // routing_version is the version after the change.
  int64 routing_version = 1;

  // effective_tablegroup is the tablegroup that now receives application traffic.
  string effective_tablegroup = 2;
}

// FoldRoutingRequest asks to complete a switched operation.
message FoldRoutingRequest {
  // database is the database whose routing changes.
  string database = 1;

  // operation_id is the operation whose rule is folded.
  string operation_id = 2;

  // expected_routing_version is the routing_version the caller read.
  int64 expected_routing_version = 3;
}

// FoldRoutingResponse reports the committed routing.
message FoldRoutingResponse {
  // routing_version is the version after the change.
  int64 routing_version = 1;

  // home_tablegroup is the home tablegroup after the fold.
  string home_tablegroup = 2;
}

// CleanupOperationRequest asks to delete the fences of an operation.
message CleanupOperationRequest {
  // database is the database the operation belongs to.
  string database = 1;

  // operation_id is the operation to clean up.
  string operation_id = 2;
}

// CleanupOperationResponse reports what was deleted.
message CleanupOperationResponse {
  // fences_deleted is how many fences of the operation were deleted.
  int32 fences_deleted = 1;
}

// RefreshAdmissionRequest tells a pooler to re-read its admission, apply it, and say what it
// holds. It waits for nothing: for a fence, the pooler closes its gate and answers at once with
// what is running or held.
message RefreshAdmissionRequest {
  // database is the database the tablegroup belongs to.
  string database = 1;

  // operation_id is the operation whose fence the coordinator has just written.
  string operation_id = 2;

  // scope is the scope the pooler serves: its tablegroup.
  AdmissionScope scope = 3;

  // expected_state and expected_version are what the coordinator has just committed.
  // They are an expectation, never permission: the pooler enforces only what it reads
  // from the control home, and fails if that is not this.
  AdmissionState expected_state = 4;
  int64 expected_version = 5;
}

// RefreshAdmissionResponse is the pooler's answer.
message RefreshAdmissionResponse {
  // pooler_id identifies the responding pooler.
  clustermetadata.ID pooler_id = 1;

  // state is the state the pooler applied.
  AdmissionState state = 2;

  // version is the version the pooler applied.
  int64 version = 3;

  // busy says what is still running or held, for a pooler that closed its gate for a fence. It
  // is unset when nothing is: the gate is closed and the pooler holds no application work. It is
  // read after the gate closes: first the requests in flight, then the reservations, so a
  // request that creates a reservation and finishes between the two reads is still seen.
  FenceBusy busy = 4;
}
